name: Build, Test & Publish NuGet

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  DOTNET_VERSION: "10.0.x"
  CONFIGURATION: Release

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    services:
      zookeeper:
        image: confluentinc/cp-zookeeper:7.6.1
        ports:
          - 2181:2181
        env:
          ZOOKEEPER_CLIENT_PORT: 2181
          ZOOKEEPER_TICK_TIME: 2000
      kafka:
        image: confluentinc/cp-kafka:7.6.1
        ports:
          - 9092:9092
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    env:
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration ${{ env.CONFIGURATION }} --no-restore

      - name: Wait for Kafka
        run: |
          for i in {1..30}; do
            if nc -z localhost 9092; then
              echo "Kafka is ready"
              exit 0
            fi
            echo "Waiting for Kafka..."
            sleep 2
          done
          echo "Kafka did not become ready in time"
          exit 1

      - name: Test
        run: dotnet test --configuration ${{ env.CONFIGURATION }} --no-build --verbosity normal

  publish:
    name: Pack & Publish NuGet
    needs: build-and-test
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration ${{ env.CONFIGURATION }} --no-restore

      # Extract version from release tag (e.g., v1.0.0 → 1.0.0)
      - name: Set version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Pack NuGet packages
        run: |
          for proj in src/**/*.csproj; do
            dotnet pack "$proj" --configuration ${{ env.CONFIGURATION }} -o ./nupkgs -p:PackageVersion=${{ steps.version.outputs.VERSION }} || true
          done

      - name: List generated packages
        run: ls -la ./nupkgs/*.nupkg

      - name: Push to GitHub Packages
        run: dotnet nuget push ./nupkgs/*.nupkg --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate

      # Reading the secret into env: first is required — GitHub Actions does
      # not allow `secrets.*` directly inside step-level `if:` expressions,
      # which fails workflow file validation (every trigger fails in 0s).
      # The env-var indirection both fixes the validation error and keeps
      # the key out of the constructed command line in logs.
      - name: Push to NuGet.org
        env:
          NUGET_KEY: ${{ secrets.NUGET_API_KEY }}
        if: env.NUGET_KEY != ''
        run: dotnet nuget push ./nupkgs/*.nupkg --source "https://api.nuget.org/v3/index.json" --api-key "$NUGET_KEY" --skip-duplicate
