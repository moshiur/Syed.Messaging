# Reference: scale a messaging worker Deployment with KEDA + Prometheus.
# Tune threshold and replica bounds using docs/observability/autoscaling-signals.md
#
# Prerequisites:
#   - KEDA installed (https://keda.sh/docs/latest/deploy/)
#   - Worker exposes messaging_* metrics to Prometheus
#   - Prometheus reachable at serverAddress from the KEDA operator namespace
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: messaging-worker
  namespace: default
  labels:
    app.kubernetes.io/name: messaging-worker
    app.kubernetes.io/component: autoscaling
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: messaging-worker
  # Hold scale-down longer than scale-up to reduce flapping on bursty queues.
  cooldownPeriod: 300
  pollingInterval: 30
  minReplicaCount: 2
  # For Kafka: set maxReplicaCount <= topic partition count for this consumer group.
  maxReplicaCount: 12
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 120
          policies:
            - type: Percent
              value: 100
              periodSeconds: 60
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 50
              periodSeconds: 120
  triggers:
    # Primary: retry pressure (transient overload / dependency slowness).
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-server.monitoring.svc:9090
        metricName: messaging_retry_pressure
        # Example: 3x baseline of 0.8 msg/s → start at 2.4; calibrate per workload.
        threshold: "2.4"
        activationThreshold: "0.5"
        query: sum(rate(messaging_messages_retried_total[5m]))
    # Optional secondary: composite pressure (retries + weighted DLQ).
    # Uncomment if a single trigger is too noisy; keep threshold conservative.
    # - type: prometheus
    #   metadata:
    #     serverAddress: http://prometheus-server.monitoring.svc:9090
    #     metricName: messaging_composite_pressure
    #     threshold: "15"
    #     activationThreshold: "2"
    #     query: |
    #       (
    #         10 * sum(rate(messaging_messages_deadlettered_total[5m]))
    #         + sum(rate(messaging_messages_retried_total[5m]))
    #       )
